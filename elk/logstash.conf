input {
  file {
    path => "/usr/share/logstash/pipeline/logs/*.jsonl"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "lab" => "DevSecOps Lab 3"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "devsecops-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
