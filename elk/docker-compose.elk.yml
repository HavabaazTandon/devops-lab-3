services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    container_name: devsecops-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    restart: unless-stopped

  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.5
    container_name: devsecops-logstash
    volumes:
      - ./elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./elk/logs:/usr/share/logstash/pipeline/logs:ro
    ports:
      - "5044:5044"
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    depends_on:
      - elasticsearch
    mem_limit: 768m
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.5
    container_name: devsecops-kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    mem_limit: 1g
    restart: unless-stopped

volumes:
  elasticsearch-data:
